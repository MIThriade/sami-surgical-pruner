[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sami-surgical-pruner"
version = "1.0.0"
description = "SAMI Surgical Pruner: Zero-Dequantization Byte-Level Layer Slicing for Dense GGUF Models"
authors = [
    { name = "Valentin Spiridon", email = "contact@tsvconsulting.online" }
]
readme = "README.md"
license = { text = "PolyForm Noncommercial 1.0.0" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "gguf>=0.10.0"
]
keywords = ["llm", "pruning", "layer-slicing", "gguf", "llama-cpp", "dense-models", "model-compression"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.scripts]
sami-prune = "sami_gguf_layer_pruner:main"

[tool.setuptools]
py-modules = ["sami_gguf_layer_pruner", "benchmark_gpu", "prune_fp16_pipeline"]
